<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • IGNOU</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:1000px;margin:30px auto;padding:20px"><h1>IGNOU Admin Panel</h1><div class="loginbox" style="padding:0"><div><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="adminLogin()">Login</button><p id="m"></p></div><div><h2>Add Product</h2><input id="title" placeholder="Title"><input id="course" placeholder="Course code"><input id="cat" placeholder="Category"><input id="price" type="number" placeholder="Price"><button onclick="addProduct()">Add</button></div></div><h2>Orders</h2><div id="orders"></div><h2>Products / PDF Upload</h2><div id="products"></div></main><script>
let A='';async function req(u,o={}){o.headers={...(o.headers||{}),'x-admin-user':sessionStorage.getItem('au')||'','x-admin-pass':sessionStorage.getItem('ap')||''};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
async function adminLogin(){try{await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}).then(async r=>{if(!r.ok)throw Error((await r.json()).error)});sessionStorage.setItem('au',u.value);sessionStorage.setItem('ap',p.value);m.textContent='Logged in';load()}catch(e){m.textContent=e.message}}
async function addProduct(){try{await req('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,course:course.value,category:cat.value,price:price.value})});alert('Product added');load()}catch(e){alert(e.message)}}
async function load(){try{const [ps,os]=await Promise.all([req('/api/admin/products'),req('/api/admin/orders')]);products.innerHTML=ps.map(p=>'<div class="card"><b>'+p.title+'</b> • ₹'+p.price+'<form onsubmit="upload(event,\''+p.id+'\')"><input type="file" accept="application/pdf" required><button>Upload PDF</button></form></div>').join('');orders.innerHTML=os.map(o=>'<div class="card"><b>'+o.product+'</b><br>User: '+o.user+'<br>Txn: '+o.txnRef+'<br>Status: '+o.status+' <button onclick="status(\''+o.id+'\',\'approved\')">Approve</button> <button onclick="status(\''+o.id+'\',\'rejected\')">Reject</button></div>').join('')}catch(e){m.textContent=e.message}}
async function upload(e,id){e.preventDefault();const f=e.target.querySelector('input').files[0];const fd=new FormData();fd.append('pdf',f);try{await req('/api/admin/products/'+id+'/pdf',{method:'POST',body:fd});alert('Uploaded')}catch(e){alert(e.message)}}
async function status(id,s){await req('/api/admin/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}
</script></body></html>
